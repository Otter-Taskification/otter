name: 'Set up an Intel oneAPI installation'
description: 'Set up an Intel oneAPI installation with a given version and install location'

inputs:
  install_root:
    description: "The install location for oneAPI"
    required: true
  version:
    description: "The oneAPI version to use"
    required: true
outputs:
  source:
    description: "The script to source to activate the installation"
    value: ${{ steps.declare.outputs.source }}


runs:
  using: "composite"
  steps:

    - name: Set installation path
      id: declare
      shell: bash
      run: |
        echo "path=${{ inputs.install_root }}/${{ inputs.version }}" >> "$GITHUB_OUTPUT"
        echo "source=${{ inputs.install_root }}/${{ inputs.version }}/setvars.sh" >> "$GITHUB_OUTPUT"

    - name: Check for cached installation
      id: check-cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.declare.outputs.path }}
        key: ${{ runner.OS }}-intel-cache-${{ steps.declare.outputs.path }}

    - name: Install intel on cache miss
      if: ${{ steps.check-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        INTEL_URL=$(sed -n "s/^${{ inputs.version }}@\(.*\)/\1/p" ./.github/ci/static/intel-urls)
        if [[ -z "$INTEL_URL" ]]; then
          echo "invalid intel version: ${{ inputs.version }}"
          exit 1
        fi
        printf "Downloading intel installer ${{ inputs.version }} from ${INTEL_URL}\n"
        wget --no-verbose "${INTEL_URL}" -O install.sh
        sh install.sh -a --action install --components intel.oneapi.lin.dpcpp-cpp-compiler \
          --install-dir '${{ steps.declare.outputs.path }}' --silent --cli --eula accept
