name: Build Otter with various compilers and OF2 versions

on:
  push:
    branches: ["dev"]

env:
  otf2_root: /opt/deps/otf2
  intel_root: /opt/intel

jobs:

  setup-otf2:
    name: Set up OTF2 versions
    strategy:
      matrix:
        os: [ubuntu-latest]
        otf2_version: ["2.3", "3.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: get repo
        uses: actions/checkout@v4
      - name: setup otf2
        uses: ./.github/actions/setup-otf2
        with:
          install_root: ${{ env.otf2_root }}
          version: ${{ matrix.otf2_version }}

  setup-intel:
    name: Set up intel versions
    strategy:
      matrix:
        os: [ubuntu-latest]
        intel_version: ["2025.1.1"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: get repo
        uses: actions/checkout@v4
      - name: setup intel
        uses: ./.github/actions/setup-intel
        with:
          install_root: ${{ env.intel_root }}
          version: ${{ matrix.intel_version }}

  build-with-gcc-and-clang:
    name: Build Otter with gcc/clang
    needs: setup-otf2
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        otf2_version: ["2.3", "3.0"]
        toolchain: ["gcc", "clang"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: get repo
        uses: actions/checkout@v4
      - name: setup otf2
        uses: ./.github/actions/setup-otf2
        with:
          install_root: ${{ env.otf2_root }}
          version: ${{ matrix.otf2_version }}
      - name: build otter
        uses: ./.github/actions/build-otter
        with:
          otf2_root: ${{ env.otf2_root }}
          otf2_version: ${{ matrix.otf2_version }}
          cc: ${{ matrix.toolchain == 'gcc' && 'gcc' || matrix.toolchain == 'clang' && 'clang' }}
          cxx: ${{ matrix.toolchain == 'gcc' && 'g++' || matrix.toolchain == 'clang' && 'clang++' }}

  build-with-intel:
    name: Build Otter with intel oneAPI
    needs: [setup-otf2, setup-intel]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        otf2_version: ["2.3", "3.0"]
        intel_version: ["2025.1.1"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: get repo
        uses: actions/checkout@v4
      - name: setup otf2
        uses: ./.github/actions/setup-otf2
        with:
          install_root: ${{ env.otf2_root }}
          version: ${{ matrix.otf2_version }}
      - name: setup intel
        id: install-intel
        uses: ./.github/actions/setup-intel
        with:
          install_root: ${{ env.intel_root }}
          version: ${{ matrix.intel_version }}
      - name: build otter
        uses: ./.github/actions/build-otter
        with:
          otf2_root: ${{ env.otf2_root }}
          otf2_version: ${{ matrix.otf2_version }}
          cc: icx
          cxx: icpx
          source: ${{ steps.install-intel.outputs.source }}
