name: Build Otter

on:
  workflow_call:
  inputs:
    cc:
      required: true
      type: string
    cxx:
      required: true
      type: string
    os:
      required: true
      type: string
    otf2_version:
      required: true
      type: string

env:
  otf2_root: /opt/deps/otf2

jobs:

  build-otter:
    name: Build Otter
    runs-on: ${{ inputs.os }}
    steps:
      - name: get repo
        uses: actions/checkout@v4
      - name: setup otf2
        uses: ./.github/actions/setup-otf2
        with:
          install_root: ${{ env.otf2_root }}
          version: ${{ inputs.otf2_version }}
      - name: build otter
        uses: .github/actions/build-otter
        with:
          otf2_root: ${{ env.otf2_root }}
          otf2_version: ${{ inputs.otf2_version }}
          cc: ${{ inputs.cc }}
          cxx: ${{ inputs.cxx }}
